<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a1a3c">
    <meta name="description" content="幼兒聽覺辨識與認知訓練遊戲：六個認知動詞、24 隻恐龍圖鑑與六章故事。">
    <title>聖誕小幫手 | Santa's Little Helper</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <link rel="stylesheet" href="./src/styles/tokens.css">
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/styles/components.css">
    <link rel="stylesheet" href="./src/styles/motion.css">
    <link rel="stylesheet" href="./src/styles/responsive.css">
    <link rel="stylesheet" href="./src/styles/a11y.css">
</head>

<body>
    <!-- 場景層（5 層視差，Step 23 建立內容） -->
    <div id="scene" aria-hidden="true">
        <div class="scene__layer" data-layer="sky"></div>
        <div class="scene__layer" data-layer="ridge"></div>
        <div class="scene__layer" data-layer="midground"></div>
        <div class="scene__layer" data-layer="character"></div>
        <div class="scene__layer" data-layer="foreground"></div>
    </div>

    <!-- 單一狀態列（Step 40 建立內容） -->
    <header id="hud" role="status" aria-live="off">
        <div class="hud__chapter"></div>
        <div class="hud__level"></div>
        <div class="hud__score"></div>
        <div class="hud__medals"></div>
    </header>

    <!-- 教學遮罩 -->
    <div id="orientation-overlay" class="overlay hidden">
        <div class="overlay-icon" aria-hidden="true">
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="2" width="10" height="20" rx="2" />
                <path d="M11 18h2" />
                <path d="M2 12h3M19 12h3" />
            </svg>
        </div>
        <h1>請將手機轉橫</h1>
        <p>Please Rotate Your Device</p>
    </div>

    <!-- 開始畫面 -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-icon" aria-hidden="true">
            <svg width="120" height="120" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#e74c3c" />
                <circle cx="50" cy="40" r="20" fill="#f1c40f" />
                <path d="M30 50 Q50 80 70 50" fill="#ecf0f1" />
                <circle cx="43" cy="35" r="3" fill="#333" />
                <circle cx="57" cy="35" r="3" fill="#333" />
                <circle cx="50" cy="42" r="4" fill="#e74c3c" opacity="0.5" />
                <path d="M20 30 Q50 5 80 30" fill="#e74c3c" stroke="white" stroke-width="5" />
                <circle cx="80" cy="30" r="8" fill="white" />
            </svg>
        </div>
        <h1>聖誕小幫手</h1>
        <p>Santa's Little Helper</p>
        <p class="overlay-cta">點擊開始</p>
    </div>

    <!-- 角色選擇 -->
    <div id="character-select-overlay" class="overlay hidden">
        <h1>選擇角色</h1>
        <p>Choose Your Character</p>
        <div class="mode-options" id="character-options"></div>
    </div>

    <!-- 玩法選擇 -->
    <div id="mode-select-overlay" class="overlay hidden">
        <h1>選擇玩法</h1>
        <p>Choose Your Adventure</p>
        <div class="mode-options" id="verb-options"></div>
    </div>

    <!-- 關卡地圖 -->
    <div id="levelmap-root" class="overlay hidden"></div>

    <!-- 恐龍圖鑑 -->
    <div id="dex-root" class="overlay hidden"></div>

    <!-- 家長報告 -->
    <div id="parent-report-root" class="overlay hidden"></div>

    <!-- 成效評估 -->
    <div id="assessment-root" class="overlay hidden"></div>

    <!-- 音量設定 -->
    <div id="audio-settings-root" class="overlay hidden"></div>

    <!-- 分享成果卡 -->
    <div id="share-root" class="overlay hidden"></div>

    <!-- 教學流程 -->
    <div id="tutorial-root" class="overlay hidden"></div>

    <!-- 劇情過場 -->
    <div id="story-root" class="overlay hidden"></div>

    <!-- 關卡完成 -->
    <div id="level-up-overlay" class="overlay hidden">
        <div class="overlay-icon" aria-hidden="true">
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l2.5 5.5L20 9.5l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-1z" />
            </svg>
        </div>
        <h1 id="level-up-text">Level Up!</h1>
    </div>

    <!-- 音訊（來源由 Step 27 的 music.json 動態指定） -->
    <audio id="bgm-player" loop preload="none"></audio>
    <audio id="ambience-player" loop preload="none"></audio>

    <main id="game-container">
        <div id="tv-view">
            <div id="snow-container" aria-hidden="true"></div>

            <div id="turn-signal" aria-hidden="true"></div>

            <div id="status-text" role="status" aria-live="polite"></div>
            <div id="combo-step-indicator" class="hidden"></div>
            <div id="mode-indicator"></div>

            <div id="level-complete-container" class="hidden">
                <button id="next-level-btn" class="level-btn" type="button">下一關</button>
                <button id="replay-level-btn" class="level-btn" type="button">再玩一次</button>
            </div>

            <div id="santa-container">
                <img id="character-img" alt="角色" src="">
                <div id="bubble">
                    <div id="bubble-content" class="prompt-content"></div>
                </div>
            </div>
        </div>

        <div id="controls-view"></div>
    </main>

    <!-- 工具列 -->
    <nav id="toolbar" role="toolbar" aria-label="遊戲工具">
        <button id="music-control-btn" class="tool-btn" type="button" aria-label="音樂">
            <img src="./assets/icons/music.svg" alt="" width="24" height="24" />
        </button>
        <button id="replay-btn" class="tool-btn" type="button" aria-label="重播">
            <img src="./assets/icons/replay.svg" alt="" width="24" height="24" />
        </button>
        <button id="slow-mode-btn" class="tool-btn" type="button" aria-label="慢速模式">
            <img src="./assets/icons/slow.svg" alt="" width="24" height="24" />
        </button>
        <button id="settings-btn" class="tool-btn" type="button" aria-label="設定">
            <img src="./assets/icons/settings.svg" alt="" width="24" height="24" />
        </button>
    </nav>

    <!-- 提示訊息層 -->
    <div id="toast-layer" aria-live="polite" aria-atomic="true"></div>
    <!-- 螢幕閱讀器即時區 -->
    <div id="sr-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./src/js/main.js"></script>
</body>

</html>
